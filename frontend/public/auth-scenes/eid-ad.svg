<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" fill="none">
  <defs>
    <linearGradient id="sky" x1="90" y1="40" x2="1170" y2="690" gradientUnits="userSpaceOnUse">
      <stop stop-color="#092D38"/><stop offset=".52" stop-color="#15524C"/><stop offset="1" stop-color="#102D3A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="matrix(0 410 -480 0 934 278)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F2C86B" stop-opacity=".27"/><stop offset="1" stop-color="#F2C86B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFF1B5"/><stop offset=".5" stop-color="#E9BD61"/><stop offset="1" stop-color="#BD813A"/>
    </linearGradient>
    <linearGradient id="city" x1="640" y1="430" x2="640" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#174C48"/><stop offset="1" stop-color="#092B35"/>
    </linearGradient>
    <filter id="softGlow" x="690" y="70" width="440" height="440" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="lanternGlow" x="0" y="0" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="9" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .twinkle{transform-box:fill-box;transform-origin:center;animation:twinkle 2.4s ease-in-out infinite alternate}
    .twinkle.delay{animation-delay:1.1s}
    .moon{transform-box:fill-box;transform-origin:center;animation:moon 5s ease-in-out infinite}
    .lantern-left{transform-box:fill-box;transform-origin:50% 0;animation:swing 3.2s ease-in-out infinite alternate}
    .lantern-right{transform-box:fill-box;transform-origin:50% 0;animation:swing 3.7s ease-in-out -1.2s infinite alternate-reverse}
    .spark{animation:rise 5s ease-in-out infinite}
    .spark.s2{animation-delay:-2.4s}.spark.s3{animation-delay:-1.1s}
    @keyframes twinkle{from{opacity:.32;transform:scale(.7)}to{opacity:1;transform:scale(1.25)}}
    @keyframes moon{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    @keyframes swing{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
    @keyframes rise{0%{opacity:0;transform:translateY(25px)}25%{opacity:.8}85%{opacity:.5}100%{opacity:0;transform:translateY(-65px)}}
    @media(prefers-reduced-motion:reduce){.twinkle,.moon,.lantern-left,.lantern-right,.spark{animation:none}}
  </style>
  <path fill="url(#sky)" d="M0 0h1280v720H0z"/>
  <path fill="url(#glow)" d="M0 0h1280v720H0z"/>
  <circle cx="908" cy="281" r="180" fill="#F0C76A" opacity=".17" filter="url(#softGlow)"/>
